spring.application.name=login-service
# SQL Server connection
# Set DB_HOST, DB_NAME, DB_USER, DB_PASSWORD environment variables to override defaults.
# In IntelliJ: Run/Debug Configurations -> Environment variables.
# For local development, copy application-local.properties.example to
# application-local.properties (gitignored) and fill in real credentials.
spring.datasource.url=${DB_URL:jdbc:sqlserver://Marecelino:1433;databaseName=JewelryLoginDemo;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8083

# JWT configuration
app.jwt.issuer=${JWT_ISSUER:http://localhost:8083}
app.jwt.audience=${JWT_AUDIENCE:jewelryshop-api}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}

# RSA keys used for signing and verifying JWT
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:./keys/private_key.pem}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./keys/public_key.pem}