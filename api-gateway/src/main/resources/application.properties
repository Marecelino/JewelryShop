spring.application.name=api-gateway
server.port=8085

# Route 1: Login Service
spring.cloud.gateway.server.webflux.routes[0].id=login-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# Route 2: Product Service
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**

# Route 3: Inventory Item Management
spring.cloud.gateway.server.webflux.routes[2].id=inventory-items-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/inventory-items,/api/v1/inventory-items/**

# Route 4: Order Service
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/orders,/api/v1/orders/**

# JWT validation
app.jwt.issuer=http://localhost:8083
app.jwt.audience=jewelryshop-api
app.jwt.public-key-location=file:D:/java/JewelryShop/login-service/keys/public_key.pem

# Allow health checks
management.endpoints.web.exposure.include=health
